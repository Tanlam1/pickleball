<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chia trận Pickleball</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">

<h1>Chia trận Pickleball</h1>
<p class="sub">Xếp lịch đánh theo số sân, đảm bảo số ván tối thiểu cho mỗi người, hạn chế trùng cặp và cân bằng trình độ.</p>

<!-- ĐỒNG BỘ -->
<section class="panel sync noprint" id="syncPanel">
  <div class="grow">
    <label>Mã phòng chung</label>
    <input type="text" id="roomId" placeholder="vd: cmc-pickleball" autocomplete="off" spellcheck="false">
  </div>
  <div class="auto"><button class="primary" id="btnJoin">Kết nối</button></div>
  <div class="auto"><button id="btnShare" style="display:none">Copy link mời</button></div>
  <div class="auto"><button id="btnLeave" style="display:none">Ngắt</button></div>
  <div class="status"><span class="led" id="led"></span><span id="statusText"></span></div>
</section>

<!-- 1. NGƯỜI CHƠI -->
<section class="panel noprint">
  <h2><span class="n">1</span> Người chơi <span class="note" id="pcount"></span></h2>

  <div class="row">
    <div style="flex:2 1 200px"><label>Tên</label>
      <input type="text" id="fName" placeholder="Nguyễn Văn A" autocomplete="off"></div>
    <div class="narrow"><label>Giới tính</label>
      <select id="fGender"><option value="M">Nam</option><option value="F">Nữ</option></select></div>
    <div class="narrow"><label>Rating</label>
      <input type="number" id="fRating" value="3.5" step="0.25" min="1" max="8"></div>
    <div class="auto"><button class="primary" id="btnAdd">Thêm</button></div>
  </div>

  <div class="tscroll" style="margin-top:16px"><table>
    <thead><tr>
      <th style="width:34px">Chơi</th><th>Tên</th><th style="width:100px">Giới tính</th>
      <th style="width:90px">Rating</th><th style="width:52px"></th>
    </tr></thead>
    <tbody id="plist"></tbody>
  </table></div>
  <p class="empty" id="pempty">Chưa có người chơi nào.</p>

  <div class="actions">
    <button id="btnAll">Chọn tất cả</button>
    <button id="btnNone">Bỏ chọn tất cả</button>
    <button id="btnSample">Nạp 14 người mẫu</button>
    <button id="btnBulk">Nhập hàng loạt</button>
    <button class="ghost" id="btnClear">Xoá hết</button>
  </div>

  <div id="bulkBox" style="display:none;margin-top:14px">
    <label>Mỗi dòng một người: <code>Tên, Nam/Nữ, Rating</code></label>
    <textarea id="bulkText" placeholder="Minh, Nam, 4.0&#10;Lan, Nữ, 3.25&#10;Hùng, Nam, 3.5"></textarea>
    <div class="actions">
      <button class="primary" id="btnBulkGo">Nhập</button>
      <button id="btnBulkCancel">Huỷ</button>
    </div>
  </div>
</section>

<!-- 2. CẤU HÌNH -->
<section class="panel noprint">
  <h2><span class="n">2</span> Cấu hình</h2>
  <div class="row">
    <div><label>Chế độ chia</label><select id="cMode">
      <option value="mixed">Đôi nam nữ (mỗi đội 1 nam + 1 nữ)</option>
      <option value="split">Tách nam nữ (đôi nam riêng, đôi nữ riêng)</option>
      <option value="free">Ngẫu nhiên tự do</option>
    </select></div>
    <div class="narrow"><label>Số sân</label>
      <input type="number" id="cCourts" value="2" min="1" max="20"></div>
    <div class="narrow"><label>Ván tối thiểu<br>mỗi người</label>
      <input type="number" id="cMin" value="4" min="1" max="50"></div>
    <div class="narrow"><label>Ván tối đa<br>(0 = không giới hạn)</label>
      <input type="number" id="cMax" value="0" min="0" max="50"></div>
    <div class="narrow"><label>Số người tối đa<br>(0 = tất cả)</label>
      <input type="number" id="cCap" value="0" min="0" max="200"></div>
  </div>
  <div style="margin-top:12px">
    <label class="check"><input type="checkbox" id="cBalance" checked>
      Cân bằng trình độ giữa 2 đội trong mỗi ván</label>
  </div>
  <div class="actions">
    <button class="primary" id="btnGen">Tạo lịch</button>
    <button id="btnRegen">Tạo lại (xáo khác)</button>
  </div>
</section>

<!-- 3. KẾT QUẢ -->
<section class="panel" id="resultPanel" style="display:none">
  <h2><span class="n">3</span> Lịch thi đấu <span class="note" id="summary"></span></h2>
  <div id="warnings"></div>
  <div id="rounds"></div>

  <h2 style="margin-top:26px">Thống kê</h2>
  <div class="tscroll"><table class="stats">
    <thead><tr>
      <th>Tên</th><th style="width:70px">GT</th><th style="width:80px">Rating</th>
      <th style="width:70px">Số ván</th><th style="width:70px">Nghỉ</th><th style="width:110px">Bạn cùng đội</th>
    </tr></thead>
    <tbody id="statsBody"></tbody>
  </table></div>

  <div class="actions noprint">
    <button id="btnCopy">Copy dạng text</button>
    <button id="btnPrint">In / Lưu PDF</button>
  </div>
</section>

</div>
<div id="toast"></div>

<script src="js/firebase-config.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
